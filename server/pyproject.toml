[project]
name = "vaohang-server"
version = "0.1.0"
description = "Máy chủ Vào Hang: theo dõi trận MU, mở/đóng hang, vỗ vai"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "anthropic>=2.1",
]

[project.optional-dependencies]
fcm = ["firebase-admin>=6.5"]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vaohang*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
