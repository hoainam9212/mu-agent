name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Máy chủ (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q

  server-postgres:
    name: Máy chủ (pytest trên Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,postgres]"
      - run: pytest -q

  docker:
    name: Máy chủ (Docker image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vaohang-server server

  android:
    name: Android (test core + build APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test logic thuần Kotlin
        run: ./gradlew -p core test --stacktrace
      - name: Lấy google-services.json từ secret (nếu có)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Có Firebase: APK nhận được thông báo đẩy"
          else
            echo "Chưa có secret GOOGLE_SERVICES_JSON: APK build không kèm Firebase"
          fi
      - name: Build APK debug
        env:
          SERVER_URL: ${{ vars.VAOHANG_SERVER_URL }}
        run: |
          if [ -n "$SERVER_URL" ]; then
            ./gradlew assembleDebug --stacktrace -Pvaohang.serverUrl="$SERVER_URL"
          else
            ./gradlew assembleDebug --stacktrace
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: vaohang-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ui-preview:
    name: Android (ảnh chụp giao diện)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Chụp màn hình bằng Paparazzi
        run: ./gradlew :app:recordPaparazziDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: vaohang-ui-preview
          path: android/app/src/test/snapshots/images/
          if-no-files-found: error
